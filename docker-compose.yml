services:
  db:
    image: postgres:15-alpine
    container_name: indieworld_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: devPassword
      POSTGRES_DB: indieworld_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d indieworld_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: indieworld_bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DATABASE_URL=postgresql://admin:devPassword@db:5432/indieworld_db?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
